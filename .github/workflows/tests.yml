name: Test code and figures

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install figure dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin poppler-utils texlive-base
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Check repository
        run: bash check_repository.sh
      - name: Reproduce included outputs
        run: bash reproduce_all.sh
